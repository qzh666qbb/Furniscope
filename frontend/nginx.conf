server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # Docker service IPs can change whenever a container is recreated. Using a
  # variable makes nginx resolve the service name at request time instead of
  # keeping the address it found only when nginx started.
  resolver 127.0.0.11 valid=1s ipv6=off;
  set $backend_upstream backend:8000;

  location /api/ {
    proxy_pass http://$backend_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /health/ {
    proxy_pass http://$backend_upstream;
  }

  location = / {
    add_header Cache-Control "no-store, max-age=0" always;
    try_files /index.html =404;
  }

  location = /index.html {
    add_header Cache-Control "no-store, max-age=0" always;
  }

  location /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
  }

  location / {
    add_header Cache-Control "no-store, max-age=0" always;
    try_files $uri $uri/ /index.html;
  }
}
