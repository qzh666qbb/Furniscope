services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: furniscope
      POSTGRES_USER: furniscope_owner
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:?set POSTGRES_APP_PASSWORD in .env}
      POSTGRES_ADMIN_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?set POSTGRES_ADMIN_PASSWORD in .env}
      POSTGRES_WORKER_PASSWORD: ${POSTGRES_WORKER_PASSWORD:?set POSTGRES_WORKER_PASSWORD in .env}
      POSTGRES_LANGGRAPH_PASSWORD: ${POSTGRES_LANGGRAPH_PASSWORD:?set POSTGRES_LANGGRAPH_PASSWORD in .env}
      POSTGRES_BACKUP_PASSWORD: ${POSTGRES_BACKUP_PASSWORD:?set POSTGRES_BACKUP_PASSWORD in .env}
      POSTGRES_MONITOR_PASSWORD: ${POSTGRES_MONITOR_PASSWORD:?set POSTGRES_MONITOR_PASSWORD in .env}
      POSTGRES_REPLICATION_PASSWORD: ${POSTGRES_REPLICATION_PASSWORD:?set POSTGRES_REPLICATION_PASSWORD in .env}
    command:
      - postgres
      - -c
      - wal_level=replica
      - -c
      - archive_mode=on
      - -c
      - archive_command=test ! -f /wal-archive/%f && cp %p /wal-archive/%f
      - -c
      - archive_timeout=300
      - -c
      - max_wal_senders=10
      - -c
      - wal_keep_size=512MB
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - postgres-wal-archive:/wal-archive
      - ./furniscope_postgresql_v3.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
      - ./migrations:/docker-entrypoint-initdb.d/migrations:ro
      - ./scripts/provision_database_roles.sh:/docker-entrypoint-initdb.d/999-provision-roles.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U furniscope_owner -d furniscope"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build: .
    restart: unless-stopped
    environment:
      PYTHONPATH: /app:/app/backend
      DATABASE_URL: postgresql+asyncpg://furniscope_app_login:${POSTGRES_APP_PASSWORD}@postgres:5432/furniscope
      ADMIN_DATABASE_URL: postgresql+asyncpg://furniscope_admin_login:${POSTGRES_ADMIN_PASSWORD}@postgres:5432/furniscope
      WORKER_DATABASE_URL: postgresql+asyncpg://furniscope_worker_login:${POSTGRES_WORKER_PASSWORD}@postgres:5432/furniscope
      LANGGRAPH_DATABASE_URL: postgresql://furniscope_langgraph_login:${POSTGRES_LANGGRAPH_PASSWORD}@postgres:5432/furniscope?options=-csearch_path%3Dfurniscope_langgraph%2Cpublic
      REDIS_URL: redis://redis:6379/0
      APP_ENV: ${APP_ENV:-development}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-["http://127.0.0.1:8083","http://localhost:8083"]}
      ANALYSIS_WORKER_MODE: ${ANALYSIS_WORKER_MODE:-external}
      ANALYSIS_TOOL_MODE: ${ANALYSIS_TOOL_MODE:-external}
      PRODUCT_PARSE_MODE: ${PRODUCT_PARSE_MODE:-model}
      UPLOAD_MAX_BYTES: ${UPLOAD_MAX_BYTES:-26214400}
      MEMORY_AUTO_EXTRACT_ENABLED: ${MEMORY_AUTO_EXTRACT_ENABLED:-false}
      AGENT_RUNTIME_ENABLED: ${AGENT_RUNTIME_ENABLED:-false}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-}
      JOB_QUEUE_MODE: redis
      DEPLOYMENT_CELL_CODE: ${DEPLOYMENT_CELL_CODE:-cell-local}
      DEPLOYMENT_REGION: ${DEPLOYMENT_REGION:-local}
      WORKER_TENANT_MAX_IN_FLIGHT: ${WORKER_TENANT_MAX_IN_FLIGHT:-1}
      WORKER_TENANT_QUEUE_LIMIT: ${WORKER_TENANT_QUEUE_LIMIT:-100}
      WORKER_TENANT_DEFER_MS: ${WORKER_TENANT_DEFER_MS:-250}
      DATABASE_ALLOW_RUNTIME_DDL: "false"
      DATABASE_REQUIRE_RUNTIME_ROLE_SEPARATION: "true"
      ALIYUN_MODEL_ROUTER_API_KEY: ${ALIYUN_MODEL_ROUTER_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_CHAT_BASE_URL: ${DEEPSEEK_CHAT_BASE_URL:-https://api.deepseek.com/v1}
      DEEPSEEK_TEXT_MODEL: ${DEEPSEEK_TEXT_MODEL:-deepseek-chat}
      FURNISCOPE_JWT_PRIVATE_KEY: ${FURNISCOPE_JWT_PRIVATE_KEY:-}
      FURNISCOPE_JWT_PUBLIC_KEYS_JSON: ${FURNISCOPE_JWT_PUBLIC_KEYS_JSON:-}
      STORAGE_BACKEND: ${STORAGE_BACKEND:-local}
      DEMO_STORAGE_ROOT: /app/var/demo_uploads
      OBJECT_STORAGE_ENDPOINT: ${OBJECT_STORAGE_ENDPOINT:-}
      OBJECT_STORAGE_ACCESS_KEY: ${OBJECT_STORAGE_ACCESS_KEY:-}
      OBJECT_STORAGE_SECRET_KEY: ${OBJECT_STORAGE_SECRET_KEY:-}
      OBJECT_STORAGE_BUCKET: ${OBJECT_STORAGE_BUCKET:-furniscope}
      OBJECT_STORAGE_REGION: ${OBJECT_STORAGE_REGION:-us-east-1}
      OBJECT_STORAGE_SECURE: ${OBJECT_STORAGE_SECURE:-true}
      OBJECT_STORAGE_AUTO_CREATE_BUCKET: ${OBJECT_STORAGE_AUTO_CREATE_BUCKET:-false}
    volumes:
      - upload-data:/app/var/demo_uploads
      - forecast-artifacts:/app/forecast_assets/tenants
      - ./var/runtime:/app/var/runtime
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready')"]
      interval: 10s
      timeout: 5s
      retries: 20

  worker:
    build: .
    restart: unless-stopped
    command: ["python", "-m", "furniscope_api.worker"]
    environment:
      PYTHONPATH: /app:/app/backend
      DATABASE_URL: postgresql+asyncpg://furniscope_app_login:${POSTGRES_APP_PASSWORD}@postgres:5432/furniscope
      ADMIN_DATABASE_URL: postgresql+asyncpg://furniscope_admin_login:${POSTGRES_ADMIN_PASSWORD}@postgres:5432/furniscope
      WORKER_DATABASE_URL: postgresql+asyncpg://furniscope_worker_login:${POSTGRES_WORKER_PASSWORD}@postgres:5432/furniscope
      LANGGRAPH_DATABASE_URL: postgresql://furniscope_langgraph_login:${POSTGRES_LANGGRAPH_PASSWORD}@postgres:5432/furniscope?options=-csearch_path%3Dfurniscope_langgraph%2Cpublic
      REDIS_URL: redis://redis:6379/0
      JOB_QUEUE_MODE: redis
      DEPLOYMENT_CELL_CODE: ${DEPLOYMENT_CELL_CODE:-cell-local}
      DEPLOYMENT_REGION: ${DEPLOYMENT_REGION:-local}
      DATABASE_ALLOW_RUNTIME_DDL: "false"
      DATABASE_REQUIRE_RUNTIME_ROLE_SEPARATION: "true"
      APP_ENV: ${APP_ENV:-development}
      ANALYSIS_WORKER_MODE: ${ANALYSIS_WORKER_MODE:-external}
      ANALYSIS_TOOL_MODE: ${ANALYSIS_TOOL_MODE:-external}
      PRODUCT_PARSE_MODE: ${PRODUCT_PARSE_MODE:-model}
      UPLOAD_MAX_BYTES: ${UPLOAD_MAX_BYTES:-26214400}
      MEMORY_AUTO_EXTRACT_ENABLED: ${MEMORY_AUTO_EXTRACT_ENABLED:-false}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-}
      ALIYUN_MODEL_ROUTER_API_KEY: ${ALIYUN_MODEL_ROUTER_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_CHAT_BASE_URL: ${DEEPSEEK_CHAT_BASE_URL:-https://api.deepseek.com/v1}
      DEEPSEEK_TEXT_MODEL: ${DEEPSEEK_TEXT_MODEL:-deepseek-chat}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-2}
      WORKER_BLOCK_MS: ${WORKER_BLOCK_MS:-5000}
      WORKER_LEASE_MS: ${WORKER_LEASE_MS:-120000}
      WORKER_MAX_ATTEMPTS: ${WORKER_MAX_ATTEMPTS:-3}
      WORKER_JOB_TIMEOUT_SECONDS: ${WORKER_JOB_TIMEOUT_SECONDS:-900}
      WORKER_TENANT_MAX_IN_FLIGHT: ${WORKER_TENANT_MAX_IN_FLIGHT:-1}
      WORKER_TENANT_QUEUE_LIMIT: ${WORKER_TENANT_QUEUE_LIMIT:-100}
      WORKER_TENANT_DEFER_MS: ${WORKER_TENANT_DEFER_MS:-250}
      WORKER_METRICS_PORT: ${WORKER_METRICS_PORT:-9108}
      AGENT_RUNTIME_ENABLED: ${AGENT_RUNTIME_ENABLED:-false}
      STORAGE_BACKEND: ${STORAGE_BACKEND:-local}
      DEMO_STORAGE_ROOT: /app/var/demo_uploads
      OBJECT_STORAGE_ENDPOINT: ${OBJECT_STORAGE_ENDPOINT:-}
      OBJECT_STORAGE_ACCESS_KEY: ${OBJECT_STORAGE_ACCESS_KEY:-}
      OBJECT_STORAGE_SECRET_KEY: ${OBJECT_STORAGE_SECRET_KEY:-}
      OBJECT_STORAGE_BUCKET: ${OBJECT_STORAGE_BUCKET:-furniscope}
      OBJECT_STORAGE_REGION: ${OBJECT_STORAGE_REGION:-us-east-1}
      OBJECT_STORAGE_SECURE: ${OBJECT_STORAGE_SECURE:-true}
      OBJECT_STORAGE_AUTO_CREATE_BUCKET: ${OBJECT_STORAGE_AUTO_CREATE_BUCKET:-false}
    expose:
      - "9108"
    volumes:
      - upload-data:/app/var/demo_uploads
      - forecast-artifacts:/app/forecast_assets/tenants
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "8083:80"
    depends_on:
      backend:
        condition: service_healthy

  minio:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    restart: unless-stopped
    profiles: ["object-storage"]
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${OBJECT_STORAGE_ACCESS_KEY:-furniscope-local}
      MINIO_ROOT_PASSWORD: ${OBJECT_STORAGE_SECRET_KEY:-change-me-object-storage}
    ports:
      - "127.0.0.1:${MINIO_API_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio-init:
    image: minio/mc:RELEASE.2025-07-21T05-28-08Z
    profiles: ["object-storage"]
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        mc alias set local http://minio:9000 "$$OBJECT_STORAGE_ACCESS_KEY" "$$OBJECT_STORAGE_SECRET_KEY";
        mc mb --ignore-existing "local/$$OBJECT_STORAGE_BUCKET";
        mc anonymous set none "local/$$OBJECT_STORAGE_BUCKET"
    environment:
      OBJECT_STORAGE_ACCESS_KEY: ${OBJECT_STORAGE_ACCESS_KEY:-furniscope-local}
      OBJECT_STORAGE_SECRET_KEY: ${OBJECT_STORAGE_SECRET_KEY:-change-me-object-storage}
      OBJECT_STORAGE_BUCKET: ${OBJECT_STORAGE_BUCKET:-furniscope}
    depends_on:
      minio:
        condition: service_healthy

  caddy:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    profiles: ["tls"]
    environment:
      FURNISCOPE_DOMAIN: ${FURNISCOPE_DOMAIN:-localhost}
      ACME_EMAIL: ${ACME_EMAIL:-ops@example.invalid}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - frontend

  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    profiles: ["operations"]
    environment:
      POSTGRES_BACKUP_URL: postgresql://furniscope_backup_login:${POSTGRES_BACKUP_PASSWORD}@postgres:5432/furniscope
      BACKUP_DIRECTORY: /backups
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
    command: ["/scripts/scheduled_backup.sh"]
    volumes:
      - ./scripts:/scripts:ro
      - postgres-backups:/backups
    depends_on:
      postgres:
        condition: service_healthy

  pitr-backup:
    image: postgres:16-alpine
    restart: unless-stopped
    profiles: ["disaster-recovery"]
    environment:
      POSTGRES_REPLICATION_URL: postgresql://furniscope_replication_login:${POSTGRES_REPLICATION_PASSWORD}@postgres:5432/furniscope
      PITR_DIRECTORY: /pitr
      PITR_RETENTION_DAYS: ${PITR_RETENTION_DAYS:-7}
      PITR_BASEBACKUP_INTERVAL_SECONDS: ${PITR_BASEBACKUP_INTERVAL_SECONDS:-86400}
    command: ["/scripts/scheduled_pitr_backup.sh"]
    volumes:
      - ./scripts:/scripts:ro
      - postgres-pitr-backups:/pitr
    depends_on:
      postgres:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v3.5.0
    restart: unless-stopped
    profiles: ["monitoring"]
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.path=/prometheus"]
    ports: ["${PROMETHEUS_PORT:-9090}:9090"]
    volumes:
      - ./deploy/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    depends_on: [backend, worker, alertmanager, postgres-exporter, redis-exporter, node-exporter, cadvisor]

  alertmanager:
    image: prom/alertmanager:v0.28.1
    restart: unless-stopped
    profiles: ["monitoring"]
    command: ["--config.file=/etc/alertmanager/alertmanager.yml"]
    ports: ["${ALERTMANAGER_PORT:-9093}:9093"]
    volumes:
      - ./deploy/monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro

  grafana:
    image: grafana/grafana:12.1.0
    restart: unless-stopped
    profiles: ["monitoring"]
    environment:
      GRAFANA_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-}
      GF_USERS_ALLOW_SIGN_UP: "false"
    entrypoint: ["/bin/sh", "/etc/grafana/furniscope-entrypoint.sh"]
    ports: ["${GRAFANA_PORT:-3000}:3000"]
    volumes:
      - ./deploy/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - ./deploy/monitoring/grafana-entrypoint.sh:/etc/grafana/furniscope-entrypoint.sh:ro
      - grafana-data:/var/lib/grafana
    depends_on: [prometheus]

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.17.1
    restart: unless-stopped
    profiles: ["monitoring"]
    environment:
      DATA_SOURCE_NAME: postgresql://furniscope_monitor_login:${POSTGRES_MONITOR_PASSWORD}@postgres:5432/furniscope?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy

  redis-exporter:
    image: oliver006/redis_exporter:v1.77.0
    restart: unless-stopped
    profiles: ["monitoring"]
    environment:
      REDIS_ADDR: redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy

  node-exporter:
    image: prom/node-exporter:v1.9.1
    restart: unless-stopped
    profiles: ["monitoring"]
    command: ["--path.rootfs=/host"]
    pid: host
    volumes:
      - /:/host:ro,rslave

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.52.1
    restart: unless-stopped
    profiles: ["monitoring"]
    privileged: true
    devices: ["/dev/kmsg"]
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro

volumes:
  postgres-data:
  postgres-wal-archive:
  redis-data:
  upload-data:
  forecast-artifacts:
  minio-data:
  postgres-backups:
  postgres-pitr-backups:
  prometheus-data:
  grafana-data:
  caddy-data:
  caddy-config:
