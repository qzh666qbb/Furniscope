<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FurniScope Design QA Comparison</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 24px; background: #e9edf2; color: #10243e; font: 600 14px system-ui, sans-serif; }
    main { width: 100%; display: grid; grid-template-columns: 1fr 1fr; gap: 20px; align-items: start; transform: scale(.5); transform-origin: top left; }
    figure { margin: 0; }
    figcaption { margin-bottom: 10px; }
    img { display: block; width: 100%; height: auto; border: 1px solid #cbd3dc; background: white; }
  </style>
</head>
<body>
  <main>
    <figure><figcaption>Source visual — Option 1</figcaption><img src="/assets/source-option-1.png" alt="Source visual" /></figure>
    <figure><figcaption>Browser implementation — 1280 × 720</figcaption><img src="/assets/implementation-1280x720.png" alt="Browser implementation" /></figure>
  </main>
</body>
</html>
